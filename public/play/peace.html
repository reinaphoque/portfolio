<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>peace.exe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Itim&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Bright party palette. Layout: one retro OS window centered on a pastel dot grid; scene + button rail, dialog row, status bar. Single deliberate look. */
:root{
  --ground:#ffe14d; --ground2:#ff8cc6; --dot:#ffffff;
  --navy:#ff5fa2; --navy-hi:#fff27a; --navy-lo:#6a1fc9; --title:#6a1fc9;
  --paper:#ffffff; --ink:#3d1080; --muted:#8a5cc4; --inset:#ffd1e6;
  --mint:#2ee6b6; --red:#ff3d6e; --gold:#ffd400; --night:#6a1fc9;
  --pixel:"Silkscreen", "Courier New", monospace;
  --thai:"Itim", "Tahoma", system-ui, sans-serif;
  color-scheme: light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;
  background:var(--ground);
  background-image:radial-gradient(var(--dot) 1.5px, transparent 1.6px), linear-gradient(var(--ground), var(--ground2));
  background-size:22px 22px, 100% 100%; background-attachment:fixed;
  color:var(--ink); font-family:var(--thai);
  display:flex; align-items:center; justify-content:center;
  padding-inline:16px; padding-block:24px; box-sizing:border-box;
}
.win{
  width:100%; max-width:560px;
  background:var(--navy); border:4px solid var(--navy-lo);
  box-shadow:6px 6px 0 0 var(--navy-lo);
  padding:0 10px 10px; box-sizing:border-box;
  transition:transform .1s;
}
.win.shake{animation:shake .45s steps(6) 2}
@keyframes shake{0%{transform:translate(0,0)}20%{transform:translate(-6px,2px)}40%{transform:translate(6px,-2px)}60%{transform:translate(-4px,-3px)}80%{transform:translate(4px,3px)}100%{transform:translate(0,0)}}
.bar{display:flex; align-items:center; gap:8px; padding-block:10px;
  border-bottom:4px solid var(--navy-lo); margin-bottom:10px;
  background:var(--navy-hi);
  margin-inline:-10px; padding-inline:12px;}
.bar h1{margin:0; flex:1; font-family:var(--pixel); font-weight:700; color:var(--paper);
  font-size:clamp(22px,6vw,34px); letter-spacing:1px; line-height:1;
  color:var(--title); text-shadow:3px 3px 0 #ffffff;}
.tbtn{width:36px; height:36px; display:grid; place-items:center; cursor:pointer;
  font-family:var(--pixel); font-size:18px; font-weight:700; color:var(--title);
  border:3px solid var(--navy-lo); box-shadow:inset -3px -3px 0 var(--inset);
  background:var(--paper); padding:0}
.tbtn.x{background:var(--red); color:#ffffff; box-shadow:inset -3px -3px 0 #c41f4c}
.tbtn:active{box-shadow:inset 3px 3px 0 var(--inset)}
.tbtn[aria-pressed="false"]{opacity:.55}
.main{display:flex; gap:10px; align-items:stretch}
.scene{flex:1; min-width:0; border:4px solid var(--navy-lo); background:#3fc4ff; line-height:0; cursor:pointer}
.scene canvas{width:100%; height:auto; image-rendering:pixelated; image-rendering:crisp-edges; display:block}
.rail{display:flex; flex-direction:column; justify-content:space-between; gap:8px}
.gift{position:relative; width:clamp(52px,14vw,74px); aspect-ratio:1; max-width:100%;
  background:var(--paper); border:4px solid var(--navy-lo); cursor:pointer; padding:0;
  box-shadow:inset -4px -4px 0 var(--inset); display:grid; place-items:center; flex:1}
.gift canvas{width:84%; image-rendering:pixelated; image-rendering:crisp-edges}
.gift:hover canvas{transform:translateY(-2px)}
.gift:focus-visible,.tbtn:focus-visible,.retry:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
.gift:active{box-shadow:inset 4px 4px 0 var(--inset)}
.gift.seen::after{content:"✓"; position:absolute; top:-8px; right:-8px; width:20px; height:20px;
  background:var(--mint); color:var(--title); font:700 14px/20px var(--pixel); text-align:center;
  border:3px solid var(--navy-lo)}
.gift.nope{animation:nope .3s steps(4)}
@keyframes nope{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.dialog{margin-top:10px; background:var(--paper); border:4px solid var(--navy-lo);
  box-shadow:inset -4px -4px 0 var(--inset); padding:10px 14px 12px; min-height:4.6em; cursor:pointer; position:relative}
.who{display:inline-block; font:700 12px/1 var(--pixel); letter-spacing:1px; color:#ffffff;
  background:var(--navy-lo); padding:5px 8px 4px; margin-bottom:6px}
.line{color:var(--ink); font-size:clamp(17px,4.4vw,21px); line-height:1.45; min-height:1.45em; margin:0}
.next{position:absolute; right:12px; bottom:8px; font:700 14px var(--pixel); color:var(--navy-lo);
  animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.status{display:flex; justify-content:space-between; align-items:center; margin-top:10px;
  color:#ffffff; font-size:15px; gap:8px; flex-wrap:wrap; text-shadow:1px 1px 0 var(--navy-lo)}
.hearts{font-family:var(--pixel); font-size:18px; letter-spacing:4px; color:var(--gold)}
.over{position:fixed; inset:0; display:grid; place-items:center; padding:16px;
  background:rgba(106,31,201,.45); z-index:5}
.pop{width:100%; max-width:440px; background:var(--navy); border:4px solid var(--navy-lo);
  box-shadow:6px 6px 0 0 var(--navy-lo); padding:0 10px 10px;
  box-sizing:border-box; animation:popin .35s steps(5)}
@keyframes popin{from{transform:scale(.2)}to{transform:scale(1)}}
.pop .bar h1{font-size:clamp(18px,5vw,24px)}
.popbody{position:relative; background:linear-gradient(#6a1fc9,#ff5fa2); border:4px solid var(--navy-lo); text-align:center;
  padding:28px 14px 22px; overflow:hidden}
.popbody canvas{position:absolute; inset:0; width:100%; height:100%; image-rendering:pixelated; pointer-events:none}
.go{position:relative; font:700 clamp(38px,12vw,58px)/1 var(--pixel); color:var(--red); margin:0;
  text-shadow:4px 4px 0 #3d1080; animation:flash .8s steps(2) infinite}
@keyframes flash{50%{color:var(--gold)}}
.hb{position:relative; font:700 clamp(17px,5vw,24px)/1.3 var(--pixel); color:#ffffff; margin:18px 0 4px}
.nm{position:relative; font:700 clamp(22px,7vw,32px)/1.2 var(--pixel); color:var(--mint); margin:0;
  text-shadow:3px 3px 0 #3d1080}
.sub{position:relative; color:#fff3fa; font-size:16px; margin:14px 0 18px}
.retry{position:relative; font:700 16px var(--pixel); color:var(--title); background:var(--gold);
  border:4px solid #ffffff; padding:8px 18px; cursor:pointer; box-shadow:4px 4px 0 #3d1080}
.retry:active{transform:translate(2px,2px); box-shadow:2px 2px 0 #3d1080}
/* ---- secret-file cover ---- */
.cover{width:100%; max-width:460px; display:grid; place-items:center}
.folder{position:relative; width:100%; box-sizing:border-box; margin-top:22px; cursor:pointer;
  background:#ffd36b; border:4px solid var(--navy-lo); box-shadow:6px 6px 0 var(--navy-lo);
  padding:26px 20px 24px; text-align:center; font:inherit; color:var(--ink)}
.folder::before{content:""; position:absolute; top:-26px; left:-4px; width:42%; height:22px;
  background:#ffd36b; border:4px solid var(--navy-lo); border-bottom:0}
.folder .sheet{position:absolute; top:-12px; right:18px; width:46%; height:22px; background:#ffffff;
  border:4px solid var(--navy-lo); border-bottom:0; z-index:-1}
.stamp{display:inline-block; border:4px solid var(--red); color:var(--red); font:700 clamp(18px,5vw,24px)/1 var(--pixel);
  padding:6px 12px 4px; transform:rotate(-8deg); letter-spacing:2px; background:rgba(255,255,255,.5)}
.folder h2{margin:16px 0 4px; font-family:var(--thai); font-weight:400; font-size:clamp(40px,12vw,56px); line-height:1.1}
.to{margin:0; font:700 clamp(13px,3.6vw,16px)/1.4 var(--pixel); color:var(--navy-lo); letter-spacing:1px}
.warn{margin:6px 0 18px; font-size:16px; color:#8a4b00}
.open-cta{display:inline-block; background:var(--navy-lo); color:#ffffff; padding:10px 18px 9px;
  font-size:clamp(18px,5vw,22px); box-shadow:4px 4px 0 var(--red)}
.open-cta b{display:inline-block; margin-left:6px; animation:nudge .6s steps(2) infinite}
@keyframes nudge{50%{transform:translateX(4px)}}
.folder:hover .open-cta{background:var(--red); box-shadow:4px 4px 0 var(--navy-lo)}
.folder:focus-visible{outline:4px solid var(--gold); outline-offset:4px}
.folder.opening{animation:rip .7s steps(7) forwards}
@keyframes rip{0%{transform:none}25%{transform:rotate(-3deg) scale(1.03)}50%{transform:rotate(3deg) scale(1.06)}100%{transform:scale(1.5); opacity:0}}
.win.enter{animation:popin .45s steps(6)}
#burst{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:20; image-rendering:pixelated}
@media (prefers-reduced-motion: reduce){
  .folder.opening,.win.enter,.open-cta b,.win.shake,.go,.next,.pop,.gift.nope{animation:none}
}
</style>
</head>
<body>

<div class="cover" id="cover">
  <button class="folder" id="folder" aria-label="เปิดเอกสารลับ">
    <span class="sheet" aria-hidden="true"></span>
    <span class="stamp">TOP SECRET</span>
    <h2>เอกสารลับ</h2>
    <p class="to">TO: PEACE TANTI</p>
    <p class="warn">ห้ามเปิดในเวลางาน</p>
    <span class="open-cta">คลิกเพื่ออ่าน<b>▶</b></span>
  </button>
</div>
<canvas id="burst" hidden></canvas>

<div class="win" id="win" hidden>
  <div class="bar">
    <h1>peace.exe</h1>
    <button class="tbtn" id="snd" aria-pressed="true" aria-label="เปิด/ปิดเสียง" title="เสียง">♪</button>
    <button class="tbtn x" id="close" aria-label="ปิด">✕</button>
  </div>
  <div class="main">
    <div class="scene" id="scene"><canvas id="cv" width="128" height="104" aria-label="ตัวละครพิกเซลยืนกลางทุ่ง"></canvas></div>
    <div class="rail">
      <button class="gift" id="b-chat" data-k="chat" aria-label="แชท"><canvas width="48" height="52"></canvas></button>
      <button class="gift" id="b-snack" data-k="snack" aria-label="ขนม"><canvas width="48" height="52"></canvas></button>
      <button class="gift" id="b-work" data-k="work" aria-label="งาน"><canvas width="48" height="52"></canvas></button>
      <button class="gift" id="b-cake" data-k="cake" aria-label="เค้กวันเกิด"><canvas width="48" height="52"></canvas></button>
    </div>
  </div>
  <div class="dialog" id="dlg" role="status" aria-live="polite">
    <span class="who" id="who">IKE</span>
    <p class="line" id="line"></p>
    <span class="next" id="nx" hidden>▼</span>
  </div>
  <div class="status">
    <span id="hint">กดปุ่มด้านขวาได้เลย</span>
    <span class="hearts" id="hearts">♡♡♡</span>
  </div>
</div>

<div class="over" id="over" hidden>
  <div class="pop" role="dialog" aria-label="Game over">
    <div class="bar"><h1>error.exe</h1><span class="tbtn x" aria-hidden="true">✕</span></div>
    <div class="popbody">
      <canvas id="conf" width="110" height="90"></canvas>
      <p class="go">GAME OVER</p>
      <p class="hb">HAPPY BIRTHDAY</p>
      <p class="nm">PEACE TANTI</p>
      <p class="sub">แต่งานก็ยังต้องส่งนะ</p>
      <button class="retry" id="retry">RETRY</button>
    </div>
  </div>
</div>

<script>
/* ===== แก้ข้อความตรงนี้ได้เลย ===== */
const SPEAKER = "IKE";
const GREETING = "ฮัลโหลพี่! ลองกดปุ่มข้างๆ ดูสิ";
const SCRIPTS = {
  chat:  ["สุขสันต์วันเกิดนะพี่!", "ขอให้ปีนี้ปังๆ งานลื่นๆ เงินเข้าเยอะๆ", "สุขภาพแข็งแรง นอนให้พอบ้างนะ"],
  snack: ["อันนี้ขนมของพี่แบบ pixel.png อ้วนแล้วไม่ต้องแดกหรอกของหวาน", "เลี้ยงข้าวผมได้นะ... ล้อเล่น ขอติดไว้ก่อนเดี๋ยวผมเลี้ยงข้าววันหน้า"],
  work:  ["อันนี้ยังไม่ต้องเปิดนะ", "วันเกิดทั้งที พี่พักเรื่องงานไว้ก่อนนะ"],
  cake:  ["เค้กมาแล้ว! อธิษฐานแล้วเป่าเทียนเลย", "ฟู่ววว~", "แก่ขึ้นอีกปีแล้วนะ แต่ยังเท่อยู่", "ขอให้เป็นปีที่ดีนะครับพี่ชายใหญ่"],
};
const ENDING = [
  {t:"ว่าแต่ว่า...", face:"glint", who:"PEACE"},
  {t:"แล้ว next step คืออะไรครับ?", face:"angry", who:"PEACE"},
];
const NEEDED = ["chat","snack","cake"];   // ปุ่มที่ต้องกดครบก่อนเข้าตอนจบ
/* ================================== */

// ---------- pixel grid helpers ----------
const G=(w,h)=>({w,h,d:new Array(w*h).fill(null)});
const set=(g,x,y,c)=>{x|=0;y|=0;if(x>=0&&y>=0&&x<g.w&&y<g.h)g.d[y*g.w+x]=c};
const get=(g,x,y)=>(x<0||y<0||x>=g.w||y>=g.h)?null:g.d[y*g.w+x];
const rect=(g,x,y,w,h,c)=>{for(let j=0;j<h;j++)for(let i=0;i<w;i++)set(g,x+i,y+j,c)};
const ell=(g,cx,cy,rx,ry,c)=>{for(let y=0;y<g.h;y++)for(let x=0;x<g.w;x++){const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1)set(g,x,y,c)}};
const outline=(g,c)=>{const o=g.d.slice();for(let y=0;y<g.h;y++)for(let x=0;x<g.w;x++){if(get(g,x,y))continue;if(get(g,x-1,y)||get(g,x+1,y)||get(g,x,y-1)||get(g,x,y+1))o[y*g.w+x]=c}g.d=o;return g};
const pad=(g,p)=>{const n=G(g.w+p*2,g.h+p*2);for(let y=0;y<g.h;y++)for(let x=0;x<g.w;x++)set(n,x+p,y+p,get(g,x,y));return n};
const PAL={k:"#5a5f9e",h:"#6b4a4f",H:"#9a6f6f",s:"#ffd9c0",b:"#ff9aa8",e:"#4b4580",w:"#ffffff",
  m:"#a0506a",t:"#f5a3b4",p:"#9fb3f2",P:"#ffffff",y:"#fbe09a",d:"#c6b8f2",D:"#9f8fe0",c:"#ffffff",
  f:"#f2edff",S:"#7b82c4",r:"#ef6f8a",R:"#f59aab",g:"#aab3dc",o:"#f9b38a",n:"#f5b6c4",q:"#f9d2b0"};
function drawG(ctx,g,ox,oy){for(let y=0;y<g.h;y++)for(let x=0;x<g.w;x++){const c=g.d[y*g.w+x];if(c){ctx.fillStyle=PAL[c]||c;ctx.fillRect(ox+x,oy+y,1,1)}}}

// crop each icon to its drawn area, then center all at the same pixel scale
const ICON_BOX={chat:[10,27,40,18],snack:[12,28,41,16],work:[13,7,45,50],cake:[13,12,39,42]};
document.querySelectorAll(".gift").forEach(b=>{const c=b.querySelector("canvas"),x=c.getContext("2d"),i=new Image(),[bx,by,bw,bh]=ICON_BOX[b.dataset.k];

// ---------- scene ----------
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let clouds=[{x:10,y:12,s:1},{x:70,y:7,s:.8},{x:105,y:22,s:1.1}];
const SKY=["#3fc4ff","#5fd0ff","#7fdcff","#a2e8ff"];
const CONF_COLS=["#ff3d6e","#ffd400","#2ee6b6","#9b5cff","#ff8a1f","#ffffff"];
let sconf=Array.from({length:28},(_,i)=>({x:Math.random()*128,y:Math.random()*90,v:.35+Math.random()*.5,c:CONF_COLS[i%6],w:i%3?1:2}));
function pell(cx,cy,rx,ry,col){ctx.fillStyle=col;for(let y=Math.floor(cy-ry);y<=cy+ry;y++)for(let x=Math.floor(cx-rx);x<=cx+rx;x++){const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1)ctx.fillRect(x,y,1,1)}}
let face="normal",base="normal",talking=false,tick=0,angry=false;
function render(){
  for(let i=0;i<4;i++){ctx.fillStyle=SKY[i];ctx.fillRect(0,i*22,128,22)}
  ctx.fillStyle="#fff";[[20,30],[52,16],[96,40],[116,10],[36,6],[84,30]].forEach(([x,y],i)=>{if((Math.floor(tick/4)+i)%3){ctx.fillRect(x,y,1,1)}else{ctx.fillRect(x-1,y,3,1);ctx.fillRect(x,y-1,1,3)}});
  clouds.forEach(c=>{pell(c.x,c.y+1.5,7*c.s,3.5*c.s,"#bfe9ff");pell(c.x,c.y,7*c.s,3.5*c.s,"#fff");pell(c.x+6*c.s,c.y-2*c.s,5*c.s,4*c.s,"#fff");pell(c.x-6*c.s,c.y+1,4*c.s,2.5*c.s,"#fff")});
  for(let x=0;x<128;x++){const y=Math.round(68+6*Math.sin(x/14));ctx.fillStyle="#c9f3ff";ctx.fillRect(x,y,1,104-y)}
  for(let x=0;x<128;x++){const y=Math.round(87+1.6*Math.sin(x/9));ctx.fillStyle="#4ee07a";ctx.fillRect(x,y,1,104-y);ctx.fillStyle="#9dff9d";ctx.fillRect(x,y,1,1)}
  ctx.fillStyle="#22b24c";[[8,94],[30,99],[100,96],[118,92],[60,101]].forEach(([x,y])=>{ctx.fillRect(x,y,1,2);ctx.fillRect(x+2,y-1,1,3);ctx.fillRect(x+4,y,1,2)});
  drawG(ctx,BAL[0],10,30+((Math.floor(tick/6))%2));
  drawG(ctx,BAL[1],104,24+((Math.floor(tick/6)+1)%2));
  drawG(ctx,BAL[2],22,44+((Math.floor(tick/7))%2));
  drawG(ctx,BAL[3],114,44+((Math.floor(tick/7)+1)%2));
  // bunting
  for(let x=0;x<128;x++){const y=Math.round(3+3*Math.sin(Math.PI*((x%64)/64)));ctx.fillStyle="#6a1fc9";ctx.fillRect(x,y,1,1);
    if(x%8===2){ctx.fillStyle=CONF_COLS[(x/8|0)%5];for(let k=0;k<5;k++)ctx.fillRect(x+Math.floor(k/2)*0+ (k<1?0:0),y+1+k,Math.max(1,5-k),1)}}
  // confetti
  sconf.forEach(p=>{ctx.fillStyle=p.c;ctx.fillRect(p.x|0,p.y|0,p.w,1)});
  if(angry){ctx.fillStyle="rgba(239,111,138,.22)";ctx.fillRect(0,0,128,104)}
  const sp=SPR[face]||SPR.normal;
  const img=talking?(Math.floor(tick/2)%2===0?sp.open:sp.closed):(Math.floor(tick/5)%2&&!reduce?sp.down:sp.closed);
  if(img.complete&&img.naturalWidth)ctx.drawImage(img,32,34);
}
function loop(){tick++;if(!reduce){clouds.forEach(c=>{c.x+=.12*c.s;if(c.x>140)c.x=-14});sconf.forEach(p=>{p.y+=p.v;p.x+=Math.sin((tick+p.v*40)/6)*.25;if(p.y>100){p.y=8;p.x=Math.random()*128}})}render()}
render();setInterval(loop,100);

// ---------- sound ----------
let ac=null,soundOn=true;
function blip(f,d=.04,type="square",v=.03){if(!soundOn)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;
  o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
document.getElementById("snd").onclick=e=>{soundOn=!soundOn;e.currentTarget.setAttribute("aria-pressed",soundOn)};

// ---------- dialog ----------
const lineEl=document.getElementById("line"),nx=document.getElementById("nx");
document.getElementById("who").textContent=SPEAKER;
const seg=(window.Intl&&Intl.Segmenter)?new Intl.Segmenter("th",{granularity:"grapheme"}):null;
const split=s=>seg?Array.from(seg.segment(s),x=>x.segment):Array.from(s);
let queue=[],typing=null,full="",onDone=null,state="idle",seen=new Set(),busy=false;
function type(text,cb){
  clearInterval(typing);full=text;nx.hidden=true;talking=true;
  const parts=split(text);let i=0;lineEl.textContent="";
  typing=setInterval(()=>{i++;lineEl.textContent=parts.slice(0,i).join("");
    if(i%2===0)blip(angry?220:660+Math.random()*120);
    if(i>=parts.length){clearInterval(typing);typing=null;talking=false;cb&&cb()}},reduce?0:38);
}
function play(lines,done,b="normal"){
  base=b;
  queue=lines.map(l=>typeof l==="string"?{t:l}:{...l});busy=true;onDone=null;
  const last=queue[queue.length-1];const prev=last.auto;
  last.auto=()=>{busy=false;nx.hidden=true;done&&done();prev&&prev()};
  nextLine();
}
function nextLine(){
  if(!queue.length){busy=false;nx.hidden=true;const d=onDone;onDone=null;d&&d();return}
  const L=queue.shift();const o=typeof L==="string"?{t:L}:L;
  face=o.face||base;angry=face==="angry";
  document.getElementById("who").textContent=o.who||SPEAKER;
  type(o.t,()=>{ if(o.auto){o.auto()} else nx.hidden=false });
}
function advance(){
  if(state==="over")return;
  if(typing){clearInterval(typing);typing=null;talking=false;lineEl.textContent=full;
    const pending=queue._auto;nx.hidden=!busy;if(pending){queue._auto=null;pending()}return}
  if(busy&&!nx.hidden){blip(880,.03);nextLine()}
}
document.getElementById("dlg").onclick=advance;
document.getElementById("scene").onclick=advance;
document.addEventListener("keydown",e=>{if((e.key===" "||e.key==="Enter")&&document.activeElement===document.body){e.preventDefault();advance()}});

function updateHearts(){const n=NEEDED.filter(k=>seen.has(k)).length;
  document.getElementById("hearts").textContent="♥".repeat(n)+"♡".repeat(NEEDED.length-n);
  document.getElementById("hint").textContent=n<NEEDED.length?"กดปุ่มด้านขวาได้เลย":"เอ๊ะ...";}

document.querySelectorAll(".gift").forEach(b=>b.onclick=()=>{
  if(busy||state!=="idle")return;
  const k=b.dataset.k;blip(523,.06);blip(784,.08);
  if(k==="work"){b.classList.remove("nope");void b.offsetWidth;b.classList.add("nope")}
  play(SCRIPTS[k],()=>{
    if(NEEDED.includes(k)){seen.add(k);b.classList.add("seen")}
    updateHearts();
    if(NEEDED.every(x=>seen.has(x))){state="ending";setTimeout(ending,700)}
  },k==="cake"?"cake":"normal");
});
document.getElementById("close").onclick=()=>{if(busy||state!=="idle")return;blip(200,.08);play(["ปิดไม่ได้หรอก ยังไม่จบ"],()=>{})};

function ending(){
  const lines=ENDING.map((l,i)=>i===ENDING.length-1?{...l,auto:()=>setTimeout(gameOver,1300)}:l);
  play(lines,()=>{});
}
// make skip-typing on the last ending line still trigger game over
const _nextLine=nextLine;
nextLine=function(){ if(queue.length===1&&queue[0].auto) queue._auto=queue[0].auto; else queue._auto=null; _nextLine(); };

function gameOver(){
  if(state==="over")return;state="over";
  const w=document.getElementById("win");w.classList.remove("shake");void w.offsetWidth;w.classList.add("shake");
  [330,262,196,131].forEach((f,i)=>setTimeout(()=>blip(f,.22,"square",.05),i*180));
  setTimeout(()=>{document.getElementById("over").hidden=false;confetti();document.getElementById("retry").focus()},900);
}
let confT=null;
function confetti(){
  const c=document.getElementById("conf"),x=c.getContext("2d");const cols=CONF_COLS;
  let ps=Array.from({length:60},()=>({x:Math.random()*110,y:Math.random()*-90,v:.4+Math.random()*.8,c:cols[Math.random()*5|0]}));
  clearInterval(confT);
  const step=()=>{x.clearRect(0,0,110,90);ps.forEach(p=>{p.y+=p.v;if(p.y>90){p.y=-2;p.x=Math.random()*110}x.fillStyle=p.c;x.fillRect(p.x|0,p.y|0,1,1)})};
  if(reduce){step();return}confT=setInterval(step,60);
}
document.getElementById("retry").onclick=()=>{
  clearInterval(confT);document.getElementById("over").hidden=true;
  seen.clear();document.querySelectorAll(".gift").forEach(b=>b.classList.remove("seen"));
  face="normal";angry=false;state="idle";updateHearts();play([GREETING],()=>{});

// ---------- cover: secret file ----------
function popper(){ if(!soundOn)return; try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  const n=ac.sampleRate*.25,buf=ac.createBuffer(1,n,ac.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
  const src=ac.createBufferSource(),g=ac.createGain();src.buffer=buf;g.gain.value=.25;src.connect(g);g.connect(ac.destination);src.start();
  const o=ac.createOscillator(),h=ac.createGain();o.type="sawtooth";o.frequency.setValueAtTime(300,ac.currentTime+.05);
  o.frequency.exponentialRampToValueAtTime(900,ac.currentTime+.35);h.gain.setValueAtTime(.05,ac.currentTime+.05);
  h.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.45);o.connect(h);h.connect(ac.destination);o.start(ac.currentTime+.05);o.stop(ac.currentTime+.5);
 }catch(e){} }
function fanfare(){[523,659,784,1047,784,1047].forEach((f,i)=>setTimeout(()=>blip(f,i>3?.22:.12,"square",.05),i*(i>3?160:110)))}
function burst(){
  const c=document.getElementById("burst");if(reduce)return;c.hidden=false;
  const W=c.width=Math.ceil(innerWidth/4),H=c.height=Math.ceil(innerHeight/4),x=c.getContext("2d");
  let ps=[];for(let i=0;i<160;i++){const left=i%2;ps.push({x:left?0:W,y:H*.75,vx:(left?1:-1)*(1+Math.random()*3.2),vy:-(2+Math.random()*3.5),c:CONF_COLS[i%6],w:1+(i%3===0)})}
  let t=0;const id=setInterval(()=>{t++;x.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.09;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;x.fillStyle=p.c;x.fillRect(p.x|0,p.y|0,p.w,p.w)});
    if(t>70){clearInterval(id);c.hidden=true}},40);
}
let started=false;
function openFile(){
  if(started)return;started=true;
  const f=document.getElementById("folder");popper();fanfare();burst();f.classList.add("opening");
  setTimeout(()=>{document.getElementById("cover").hidden=true;const w=document.getElementById("win");w.hidden=false;w.classList.add("enter");
    setTimeout(()=>play([GREETING],()=>{}),400)},reduce?0:650);
}
document.getElementById("folder").onclick=openFile;
